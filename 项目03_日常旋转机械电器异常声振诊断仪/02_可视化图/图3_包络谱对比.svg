<text x="86.0" y="47.0" font-size="11.5" fill="#7C8493" text-anchor="start">包络电平不随遮挡程度单调变化（L4 最高、L2 最低），它是转速与遮挡的共同结果；可用信息在谱线位置而非整体电平。0–3 Hz 的抬升来自转速慢变与拍频，属包络近直流成分，不作判据</text>
